name: Build and deploy Python app to Azure Web App - kgts-Interactive-learning-system

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Prepare deployment package
        run: |
          set -euo pipefail
          rm -rf deploy kgts-app.zip
          mkdir deploy
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.tmp' \
            --exclude '.venv' \
            --exclude 'antenv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'backend/vector_index_system/memory_systems' \
            --exclude 'backend/vector_index_system/models' \
            --exclude 'backend/vector_index_system/vector_index' \
            --exclude 'requirements-tts.txt' \
            --exclude 'requirements-gpt-sovits-tts.txt' \
            --exclude 'third_party/Genie-TTS' \
            --exclude 'third_party/genie-tts' \
            --exclude 'Genie-TTS' \
            --exclude 'genie-tts' \
            --exclude '.runtime/tts' \
            --exclude 'models/tts' \
            --exclude 'models/genie-tts' \
            --exclude 'backend/models/tts' \
            --exclude 'backend/models/genie-tts' \
            --exclude '**/GenieData' \
            --exclude '**/genie_data' \
            --exclude '**/tts-cache' \
            --exclude '**/tts-output' \
            --exclude '**/tts-audio' \
            --exclude '*.onnx' \
            --exclude '*.safetensors' \
            --exclude '*.ckpt' \
            --exclude '*.pt' \
            --exclude '*.pth' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist/.vite' \
            ./ deploy/
          chmod +x deploy/startup.sh
          cd deploy
          zip -r ../kgts-app.zip . -x "*/__pycache__/*" "*.pyc" "*.pyo"
          cd ..
          unzip -l kgts-app.zip | head -80

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: kgts-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CDE106AA5390482CB8D021E302ABE476 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5381AC78696F4A1D8BDAC52DC299ECC8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8540526E18BF4BA88AB83FDEE7892B9E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: kgts-Interactive-learning-system
          slot-name: Production
          package: kgts-app.zip
