name: Build and deploy Python app to Azure Web App - kgts-Interactive-learning-system

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements/vector-cpu.txt

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Smoke test Azure production app import
        env:
          KGTS_RETRIEVAL_MODE: hybrid
          KGTS_VECTOR_STARTUP_ENSURE: "0"
          KGTS_VECTOR_UNLOAD_AFTER_QUERY: "1"
          KGTS_VECTOR_UNLOAD_AFTER_REBUILD: "1"
          KGTS_TTS_ENABLED: "1"
          KGTS_TTS_PROVIDER: genie_server
          KGTS_TTS_SERVER_URL: http://127.0.0.1:9880
          APP_RUN_STARTUP_MAINTENANCE: "0"
          RENDER_AUTO_SYNC_STRUCTURED: "0"
        run: |
          python - <<'PY'
          import os
          import render_app
          from KGTS.core.tts_service import get_tts_status
          from KGTS.core.graph_service import GraphService

          assert render_app.app is not None
          tts = get_tts_status()
          assert tts["enabled"] is True
          assert tts["provider"] == "genie_server"
          stats = GraphService().read_graph().get("vector_stats", {})
          assert stats.get("mode") == "hybrid"
          assert stats.get("unload_after_query") is True
          print("azure smoke ok", {"tts": tts["provider"], "retrieval": stats.get("mode")})
          PY

      - name: Prepare deployment package
        run: |
          set -euo pipefail
          rm -rf deploy kgts-app.zip
          mkdir deploy
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.tmp' \
            --exclude '.venv' \
            --exclude 'antenv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'backend/vector_index_system/memory_systems' \
            --exclude 'backend/vector_index_system/models' \
            --exclude 'backend/vector_index_system/vector_index' \
            --exclude 'data/seed/vector_index' \
            --exclude 'data/seed/vector_index/**' \
            --exclude 'third_party/Genie-TTS' \
            --exclude 'third_party/genie-tts' \
            --exclude 'Genie-TTS' \
            --exclude 'genie-tts' \
            --exclude '.runtime/tts' \
            --exclude 'models/tts' \
            --exclude 'models/genie-tts' \
            --exclude 'backend/models/tts' \
            --exclude 'backend/models/genie-tts' \
            --exclude '**/GenieData' \
            --exclude '**/genie_data' \
            --exclude '**/tts-cache' \
            --exclude '**/tts-output' \
            --exclude '**/tts-audio' \
            --exclude '*.onnx' \
            --exclude '*.safetensors' \
            --exclude '*.ckpt' \
            --exclude '*.pt' \
            --exclude '*.pth' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist/.vite' \
            ./ deploy/
          chmod +x deploy/startup.sh
          cd deploy
          zip -r ../kgts-app.zip . -x "*/__pycache__/*" "*.pyc" "*.pyo"
          cd ..
          unzip -l kgts-app.zip | head -80
          if unzip -l kgts-app.zip | grep -q 'data/seed/vector_index/'; then
            echo "data/seed/vector_index must not be included in the Azure App Service package" >&2
            exit 1
          fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: kgts-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_WEBAPP_PUBLISH_PROFILE_SET: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Show deployment authentication route
        run: |
          if [ "${AZURE_WEBAPP_PUBLISH_PROFILE_SET}" = "true" ]; then
            echo "Using AZURE_WEBAPP_PUBLISH_PROFILE for zip deployment."
          else
            echo "::notice::AZURE_WEBAPP_PUBLISH_PROFILE is not configured; falling back to Azure OIDC login. If azure/login reports 'No subscriptions found', grant the configured client id access to the App Service subscription/resource group or add the publish profile secret."
          fi

      - name: Deploy to Azure Web App with publish profile
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE_SET == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: kgts-Interactive-learning-system
          slot-name: Production
          package: kgts-app.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Login to Azure
        id: azure-login
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE_SET != 'true'
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CDE106AA5390482CB8D021E302ABE476 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5381AC78696F4A1D8BDAC52DC299ECC8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8540526E18BF4BA88AB83FDEE7892B9E }}

      - name: Explain Azure OIDC authentication failure
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE_SET != 'true' && steps.azure-login.outcome == 'failure'
        run: |
          echo "::error::Azure OIDC login failed before deployment. The build artifact is ready, but the configured Azure identity cannot see the target subscription. Fix one of these: add GitHub secret AZURE_WEBAPP_PUBLISH_PROFILE from the App Service publish profile, or grant the AZUREAPPSERVICE_CLIENTID identity access to the App Service subscription/resource group and confirm its federated credential matches repo:mysteriousFourier/Knowledge-Graph-Teaching-System:ref:refs/heads/main."
          exit 1

      - name: Deploy to Azure Web App
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE_SET != 'true' && steps.azure-login.outcome == 'success'
        uses: azure/webapps-deploy@v3
        with:
          app-name: kgts-Interactive-learning-system
          slot-name: Production
          package: kgts-app.zip
