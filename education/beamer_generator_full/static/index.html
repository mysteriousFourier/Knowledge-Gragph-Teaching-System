<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX Beamer 演示文稿生成器</title>
  <link rel="stylesheet" href="/beamer-generator/static/style.css?v=20260525-saved-ppt-catalog-v70">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
</head>
<body>

<div class="container">
  <div class="panel panel-input">
    <div class="form-row">
      <div class="form-group">
        <label for="style">风格</label>
        <select id="style">
          <option value="academic" selected>学术报告</option>
          <option value="business">商务汇报</option>
          <option value="minimal">极简风格</option>
        </select>
      </div>
      <div class="form-group">
        <label for="slideCount">最少页数</label>
        <input type="number" id="slideCount" value="7" min="1" max="80" />
        <small>默认至少生成 7 页，系统会严格补足到该页数</small>
      </div>
      <div class="form-group">
        <label for="language">语言风格</label>
        <select id="language">
          <option value="title_terms_en_content_zh" selected>大标题/人名/专业词汇英文，小标题和内容中文</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="customRequirements">自定义要求（可选）</label>
      <textarea id="customRequirements" rows="4"
        placeholder="输入演示文稿生成要求，例如页数节奏、公式展示方式、重点概念等。"></textarea>
      <small>要求会和导入的 Markdown 知识图谱一起发送给 AI。</small>
    </div>

    <div class="form-group">
      <label>Markdown 知识图谱内容</label>
      <div class="saved-lecture-picker">
        <select id="savedLectureSelect" style="display:none;">
          <option value=""></option>
        </select>
        <button id="btnRefreshSavedLectures" type="button" class="btn-secondary" style="display:none;">刷新</button>
        <button id="btnImportMarkdown" type="button" class="btn-secondary">导入 MD 知识图谱</button>
        <button id="btnImportSupplementMarkdown" type="button" class="btn-secondary">导入补充章节</button>
        <button id="btnImportGraphPackage" type="button" class="btn-secondary">上传图片包</button>
      </div>
      <div id="markdownImportList" class="markdown-import-list" aria-live="polite"></div>
      <div id="markdownSelectionSummary" class="markdown-selection-summary" aria-live="polite"></div>
      <textarea id="content" class="source-content-store" aria-hidden="true" tabindex="-1"></textarea>
      <div class="lecture-preview-box">
        <div class="lecture-preview-title-row">
          <div class="lecture-preview-title">Markdown 预览</div>
          <button id="btnTogglePackageImages" type="button" class="btn-secondary" disabled>展开图片</button>
        </div>
        <div id="contentPreview" class="math-preview muted">导入 .md/.markdown 知识图谱文件后，内容会显示在这里。</div>
        <div id="packageImagePanel" class="package-image-panel" style="display:none;">
          <button type="button" class="package-image-panel-close" data-action="close-package-image-panel" aria-label="关闭图片预览">×</button>
          <div id="packageImageGrid" class="package-image-grid"></div>
        </div>
      </div>
    </div>

    <button id="btnGenerate" class="btn-primary">生成演示文稿</button>
    <div id="latexImportPanel" class="latex-import-panel" style="display:none;">
      <div class="latex-import-title">导入 LaTeX 渲染高保真 PPT</div>
      <div class="latex-import-actions">
        <button id="btnImportLatexFile" type="button" class="btn-secondary">导入 .tex / PDF / ZIP 文件</button>
        <button id="btnImportLatexProject" type="button" class="btn-secondary">导入 LaTeX 项目目录</button>
        <button id="btnParseImportedLatex" type="button" class="btn-primary">渲染为高保真 PPT</button>
      </div>
      <div id="latexImportMeta" class="latex-import-meta">导入 LaTeX、PDF 或 Overleaf ZIP 后，将按编译 PDF 页面渲染为 PPT；若源码引用图片或样式文件，请使用项目目录导入。</div>
    </div>
  </div>

  <div class="resize-handle" id="mainResizeHandle" title="拖拽调整左右区域宽度" aria-label="拖拽调整左右区域宽度">
    <span class="resize-handle-grip"></span>
    <button id="btnToggleInputPanel" type="button" class="input-collapse-toggle" aria-label="折叠左侧面板" title="折叠左侧面板">&lt;&lt;</button>
  </div>

  <div class="panel panel-output">
    <div class="output-header">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="latex">LaTeX 代码</button>
        <button class="tab-btn" data-tab="ppt" id="tabPpt" disabled>PPT 编辑</button>
      </div>
      <div class="output-actions">
        <div class="latex-actions">
          <button id="btnCopy" type="button" class="btn-secondary" disabled>复制代码</button>
          <button id="btnDownloadTex" type="button" class="btn-secondary" disabled>下载 .tex</button>
          <button id="btnOpenOverleaf" type="button" class="btn-secondary" disabled>在 Overleaf 中编辑</button>
          <button id="btnImportOverleafResult" type="button" class="btn-secondary">导入 Overleaf 结果</button>
          <button id="btnImportEquationSource" type="button" class="btn-secondary">导入公式章节</button>
          <button id="btnConvertPpt" type="button" class="btn-accent" disabled>转换为 PPT</button>
          <button id="btnDownloadPptx" type="button" class="btn-accent" disabled>下载 PPT</button>
        </div>
        <div class="ppt-actions" style="display:none;">
          <button id="btnAddSlide" type="button" class="btn-secondary">添加页面</button>
          <input id="pptChapterTitleInput" class="ppt-save-title-input" type="text" name="ppt-save-title-manual" aria-label="保存章节标题" placeholder="当前 PPT 名称" autocomplete="new-password" autocapitalize="off" spellcheck="false" data-lpignore="true" />
          <button id="btnSaveProject" type="button" class="btn-primary">保存</button>
          <div class="saved-ppt-section saved-ppt-section-inline">
            <div class="saved-ppt-section-title">已保存 PPT</div>
            <div class="saved-ppt-tools">
              <select id="savedPptChapterSelect" class="saved-ppt-chapter-select saved-ppt-chapter-native" aria-label="已保存 PPT 章节">
                <option value="">选择章节</option>
              </select>
              <button id="btnSavedPptChapterToggle" class="btn-secondary saved-ppt-chapter-toggle" type="button" aria-expanded="false" aria-controls="savedPptChapterList">选择已保存章节</button>
              <button id="btnRefreshSavedPpt" class="btn-secondary saved-ppt-refresh" type="button" title="刷新已保存内容">刷新</button>
              <div id="savedPptChapterList" class="saved-ppt-chapter-list" aria-label="已保存 PPT 章节列表"></div>
              <div id="savedPptSlideGallery" class="saved-ppt-slide-gallery" aria-label="已保存章节页面" style="display:none;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="viewLatex" class="view-panel active">
      <div id="status" class="status latex-status"></div>
      <div id="editorWrapper">
        <textarea id="editor"></textarea>
      </div>
    </div>

    <div class="inner-resize-handle" id="innerResizeHandle" title="拖动调整左右板块宽度" aria-label="拖动调整左右板块宽度" style="display:none;">
      <span class="resize-handle-grip"></span>
    </div>

    <div id="viewPpt" class="view-panel" style="display:none;">
      <div class="ppt-editor">
        <div class="slide-list" id="slideList"></div>
        <div class="slide-editor" id="slideEditor">
          <div class="slide-canvas" id="slideCanvas">
            <div class="slide-placeholder">点击左侧幻灯片或点击“转换为 PPT”开始编辑。</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="imageUploader" accept="image/*" style="display:none;" />
<input type="file" id="markdownImporter" accept=".md,.markdown,text/markdown,text/x-markdown" multiple style="display:none;" />
<input type="file" id="supplementMarkdownImporter" accept=".md,.markdown,text/markdown,text/x-markdown" multiple style="display:none;" />
<input type="file" id="graphPackageImporter" accept=".png,.jpg,.jpeg,.gif,.webp,.svg,.bmp" webkitdirectory multiple style="display:none;" />
<input type="file" id="latexImporter" accept=".tex,.latex,.pdf,.zip,text/x-tex,text/plain,application/pdf,application/zip" style="display:none;" />
<input type="file" id="latexProjectImporter" webkitdirectory multiple style="display:none;" />
<input type="file" id="equationSourceImporter" accept=".tex,.latex,.md,.markdown,.txt,text/x-tex,text/markdown,text/plain" style="display:none;" />
<form id="openOverleafForm" action="https://www.overleaf.com/docs" method="post" target="_blank" style="display:none;">
  <input type="hidden" name="snip_uri[]" id="overleafZipDataUri" />
</form>

<div id="packageImageViewer" class="package-image-viewer" style="display:none;" role="dialog" aria-modal="true" aria-label="图片预览">
  <div class="package-image-viewer-backdrop"></div>
  <div class="package-image-viewer-dialog">
    <button type="button" class="package-image-viewer-close" data-action="close-package-image-viewer" aria-label="关闭">×</button>
    <img id="packageImageViewerImage" class="package-image-viewer-image" alt="" />
    <div id="packageImageViewerCaption" class="package-image-viewer-caption"></div>
  </div>
</div>

<div id="savedSlidePreviewModal" class="saved-slide-preview-modal" style="display:none;" role="dialog" aria-modal="true" aria-label="保存页面预览">
  <div class="saved-slide-preview-backdrop" data-action="close-saved-slide-preview"></div>
  <div class="saved-slide-preview-dialog">
    <button type="button" class="saved-slide-preview-close" data-action="close-saved-slide-preview" aria-label="关闭">×</button>
    <div id="savedSlidePreviewContent" class="saved-slide-preview-content"></div>
  </div>
</div>

<div id="figureHoverPreview" class="figure-hover-preview" style="display:none;" aria-hidden="true">
  <div class="figure-hover-preview-inner">
    <img id="figureHoverPreviewImage" class="figure-hover-preview-image" alt="" />
    <div class="figure-hover-preview-meta">
      <div id="figureHoverPreviewLabel" class="figure-hover-preview-label"></div>
      <div id="figureHoverPreviewCaption" class="figure-hover-preview-caption"></div>
    </div>
  </div>
</div>

<div id="equationSourcePanel" class="equation-source-panel" style="display:none;" role="dialog" aria-label="公式目录">
  <div class="equation-source-panel-head">
    <div>
      <div class="equation-source-panel-title">公式目录</div>
      <div id="equationSourceSummary" class="equation-source-panel-summary"></div>
    </div>
    <button id="btnCloseEquationSourcePanel" type="button" class="equation-source-close" aria-label="关闭">×</button>
  </div>
  <div class="equation-source-columns">
    <div class="equation-source-column">
      <div class="equation-source-column-title">当前章节可引用公式</div>
      <div id="equationSourceList" class="equation-source-list"></div>
    </div>
    <div class="equation-source-column equation-source-extra-column">
      <div class="equation-source-column-title">非本章缺失公式</div>
      <div id="equationSourceExtraList" class="equation-source-list equation-source-extra-list"></div>
    </div>
  </div>
  <div class="equation-source-panel-actions">
    <button id="btnReferenceSelectedEquations" type="button" class="btn-primary">引用选中公式</button>
  </div>
</div>

<div id="supplementChapterPanel" class="equation-source-panel supplement-chapter-panel" style="display:none;" role="dialog" aria-label="补充章节目录">
  <div class="equation-source-panel-head">
    <div>
      <div class="equation-source-panel-title">补充章节目录</div>
      <div id="supplementChapterSummary" class="equation-source-panel-summary"></div>
    </div>
    <button id="btnCloseSupplementChapterPanel" type="button" class="equation-source-close" aria-label="关闭">×</button>
  </div>
  <div class="equation-source-columns supplement-chapter-columns">
    <div class="equation-source-column">
      <div class="equation-source-column-title">按 001 / 001.002 编号识别的小节</div>
      <div id="supplementChapterList" class="equation-source-list supplement-chapter-list"></div>
    </div>
  </div>
  <div class="equation-source-panel-actions">
    <button id="btnAddSelectedSupplementChapters" type="button" class="btn-primary">添加选中章节</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/stex/stex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="/beamer-generator/static/app.js?v=20260529-latex-project-render-v77"></script>

</body>
</html>
